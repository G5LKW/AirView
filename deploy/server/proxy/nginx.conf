# nginx in front of AirView with TLS from certbot (Let's Encrypt).
#
#   sudo cp nginx.conf /etc/nginx/sites-available/airview      (Debian/Ubuntu layout)
#   sudo ln -s ../sites-available/airview /etc/nginx/sites-enabled/airview
#   (replace feed.example.org everywhere)
#   sudo certbot certonly --webroot -w /var/www/html -d feed.example.org \
#        --deploy-hook "systemctl reload nginx; /opt/airview/avf-cert-sync.sh"
#   sudo nginx -t && sudo systemctl reload nginx
#
# AirView side (installed with: install.sh --proxy, or by hand in
# /etc/airview/airview.jsonc):
#   "http":       { "port": 8080, "bindAddr": "127.0.0.1" },
#   "aggregator": { "trustedProxies": ["127.0.0.1/32", "::1/128"] }
# The feeder ports 30160 / 30004 / 31090 are raw TCP and are NOT proxied here
# (FIREWALL.md); avf-cert-sync.sh (in the certbot hook above) gives the AVF/1
# listener a copy of the same certificate.

upstream airview {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name feed.example.org;

    # certbot --webroot answers its challenge from here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feed.example.org;

    ssl_certificate     /etc/letsencrypt/live/feed.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feed.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AirViewTLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Access logs contain client IP addresses. For a public aggregator keep
    # them off or short-lived (see the privacy notice, DESIGN §8.5).
    access_log off;

    # Aircraft-database upload (/api/db/acdb/upload) accepts up to 600 MB.
    client_max_body_size 650m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # AirView walks X-Forwarded-For from the right and stops at the first
    # address that is not in trustedProxies, so appending is safe: a client
    # cannot spoof its address by sending the header itself.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Overwrite (never append) the scheme: AirView marks session cookies
    # Secure when this says https.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    # Live updates: server-sent events. AirView also sends X-Accel-Buffering: no.
    location = /api/events {
        proxy_pass http://airview;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://airview;
    }
}

# Behind a CDN (e.g. Cloudflare) in front of nginx: either restore the real
# client address in nginx (ngx_http_realip_module: set_real_ip_from <CDN ranges>;
# real_ip_header CF-Connecting-IP;) and keep AirView's trustedProxies at the
# local hop, or add the CDN ranges to AirView's aggregator.trustedProxies.
